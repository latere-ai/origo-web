# A tag publishes the image and the GitHub release, and then rolls Latere's
# own installation.
#
# The deploy job is Latere's and nobody else's. It runs only where the
# variable ORIGOWEB_RELEASE_DEPLOY is set, which is this repository and no
# fork, and it waits on the production environment's reviewer before it
# touches a cluster. Another installation runs the same manifests against
# its own overlay and never reaches this job, so what a target runs is
# still a tag pinned in an overlay applied by whoever owns that cluster.
#
# The image is built from the tag's tree by the Dockerfile in this
# repository, so the bytes a target pulls come from a commit anyone can
# check out. Nothing is built by hand and pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/latere-ai/origoweb

jobs:
  image:
    name: image and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      # docker/metadata-action sanitizes an image tag to [a-zA-Z0-9._-], so
      # a SemVer build-metadata tag would push under a name that is not the
      # git tag. An overlay pins the git tag, so the two must be equal.
      - name: Reject build-metadata tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *+*) echo "::error::${TAG} carries SemVer build metadata; an image tag cannot contain '+'. Cut a tag without it."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build stage cross-compiles and the runtime stage is a static
      # distroless base with no package step, so linux/arm64 needs no
      # emulator; buildx alone is enough.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push origoweb
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx build --push --provenance=false --sbom=false \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$TAG" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            -t "${IMAGE}:${TAG}" \
            --metadata-file image.json .
          digest=$(jq -r '."containerimage.digest"' image.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${TAG} is ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert both architectures are published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw > manifest.json
          for arch in amd64 arm64; do
            grep -q "\"architecture\": *\"$arch\"" manifest.json \
              || { echo "::error::${IMAGE}:${TAG} has no linux/$arch entry"; exit 1; }
          done

      # The release body is the tag's section of CHANGELOG.md, which the
      # pre-push hook already refused to push without.
      #
      # It is read by the same tool that writes it. A second reader here
      # would have to agree with `lateregate release` on the shape of a
      # section heading by hand, and the first time they disagreed a
      # release would fail after the image was already pushed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Read the release note for this tag
        id: note
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go tool lateregate release-notes "$TAG" > note.md
          test -s note.md || { echo "::error::CHANGELOG.md has no section for ${TAG}"; exit 1; }

      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '\n`%s:%s`\n' "$IMAGE" "$TAG" >> note.md
          printf '\nDigest: `%s`\n' "${{ steps.build.outputs.digest }}" >> note.md
          gh release create "$TAG" --title "$TAG" --notes-file note.md

  # code.latere.ai is one host split by path: origod answers /v1/, the git
  # paths, /readyz and /version, and this interface answers everything else.
  # The smoke therefore reads the sign-in page, which is this service's, and
  # the roll is proved from the Deployment's own image rather than from a
  # /version that belongs to the node.
  deploy:
    name: deploy and smoke
    needs: image
    if: ${{ vars.ORIGOWEB_RELEASE_DEPLOY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://code.latere.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.ORIGOWEB_KUBECONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      # deploy/prod holds only re-appliable manifests; deploy/bootstrap is
      # never read here. Applying the overlay is what removes a setting the
      # overlay has dropped: a variable left on the live Deployment outlives
      # the release that removed it, and `set image` alone would not clear
      # it.
      - name: Apply deploy/prod and roll the new image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The namespace is the overlay's, not a name repeated here.
          NS=$(kubectl kustomize deploy/prod | awk '/^  namespace: /{print $2; exit}')
          test -n "$NS"
          kubectl apply -k deploy/prod/
          kubectl -n "$NS" set image deployment/origoweb "origoweb=${IMAGE}:${TAG}"
          kubectl -n "$NS" rollout status deployment/origoweb --timeout=300s
          # A green rollout that left the old tag in place is the failure
          # this job exists to make impossible, so the tag is read back.
          got=$(kubectl -n "$NS" get deployment/origoweb \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$got" = "${IMAGE}:${TAG}" \
            || { echo "::error::the Deployment runs ${got}, not ${IMAGE}:${TAG}"; exit 1; }

      - name: Smoke the sign-in page
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -o page.html -w '%{http_code}' https://code.latere.ai/)
          test "$code" = 200 || { echo "::error::code.latere.ai answered ${code}"; exit 1; }
          # Matched without the title's separator, which is multibyte: a
          # runner under a C locale would not match it with a dot.
          grep -q 'Latere Code</title>' page.html \
            || { echo "::error::code.latere.ai did not serve the sign-in page"; exit 1; }
          echo "code.latere.ai serves the sign-in page on ${TAG}" >> "$GITHUB_STEP_SUMMARY"

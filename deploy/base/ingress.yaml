# The interface on its own hostname, which is the simplest shape and the one
# an installation should reach for first: nothing routes, and no rule can be
# wrong.
#
# One hostname can serve both, and deploy/prod does. Origo's browser-facing
# surface is a closed list -- the API under /v1/, the two probes, the key
# set, the favicon, and smart HTTP, which is always exactly two path
# segments followed by info/refs, git-upload-pack or git-receive-pack --
# so the split is a finite rule rather than a guess about repository names.
# Sharing a hostname puts the clone URL and the page that shows it on one
# origin; it also gives up Origo's landing page, which the interface's home
# screen replaces.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origoweb
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  rules:
    - host: code.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origoweb
                port: {name: http}
  tls:
    - hosts: [code.example.com]
      secretName: origoweb-tls

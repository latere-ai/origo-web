# The addresses this installation runs on, and the name it goes by.
#
# ORIGOWEB_ORIGO_URL is the in-cluster Service, so a page is rendered from
# reads that never leave the cluster. ORIGOWEB_CLONE_HOST is the public
# hostname, which is the same one this interface answers on: a reader copies
# the clone line from a page served by the host they clone from.
# ORIGOWEB_SSH_CLONE_HOST is where port 22 reaches origod-ssh: Origo's
# production overlay publishes SSH on a load balancer of its own
# (deploy/prod/ssh-service.yaml there), which has an address of its own,
# so it is a name of its own, pointed at that address. It turns the SSH
# tab of the clone box on, so it must resolve before this ships.
#
# This installation is Latere's, so it carries Latere's name and Latere's
# mark. Both are settings and neither has a default: an installation nobody
# names calls itself Origo and draws no mark at all.
#
# ORIGOWEB_KEYS_URL turns the SSH keys screen on. It is unset in the base,
# because an operator who runs no key store has no place to add a key and
# is better served by no screen than by one that cannot work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origoweb
spec:
  template:
    spec:
      containers:
        - name: origoweb
          env:
            - name: ORIGOWEB_ORIGO_URL
              value: http://origod.latere.svc.cluster.local
            - name: ORIGOWEB_PUBLIC_URL
              value: https://code.latere.ai
            - name: ORIGOWEB_CLONE_HOST
              value: https://code.latere.ai
            - name: ORIGOWEB_SSH_CLONE_HOST
              value: ssh.code.latere.ai
            - name: ORIGOWEB_ISSUER_NAME
              value: Latere
            - name: ORIGOWEB_PRODUCT_NAME
              value: Latere Code
            - name: ORIGOWEB_BRAND_MARK
              value: latere
            # The key store. Origo holds no public key: it asks auth whose
            # an offered key is, and auth is where a person adds one, so
            # this is the same address the session is signed in against
            # (auth's spec 075). The public host rather than the in-cluster
            # Service, because the call carries the person's own token and
            # the issuer in that token is the public one.
            - name: ORIGOWEB_KEYS_URL
              value: https://auth.latere.ai
            # The scope auth requires before it will let this interface
            # manage a person's keys. Adding a public key creates a
            # credential that pushes to every repository that person can
            # write, so auth gates it on a scope granted to this one client
            # rather than on holding any valid token. The base asks for the
            # OIDC minimum: a scope an issuer has not registered is refused
            # at the authorization request, so it belongs here, where the
            # issuer is known to grant it.
            - name: ORIGOWEB_AUTH_SCOPES
              value: openid,email,profile,offline_access,origo:ssh-keys

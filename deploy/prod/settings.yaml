# The addresses this installation runs on, and the name it goes by.
#
# ORIGOWEB_ORIGO_URL is the in-cluster Service, so a page is rendered from
# reads that never leave the cluster. ORIGOWEB_CLONE_HOST is the public
# hostname, which is the same one this interface answers on: a reader copies
# the clone line from a page served by the host they clone from.
# ORIGOWEB_SSH_CLONE_HOST is the same hostname again: one host for the
# site, HTTPS clones and SSH clones. Port 22 on it reaches origod-ssh
# through the ingress controller's TCP passthrough, so people clone with
# git@code.latere.ai:owner/name.git. It turns the SSH tab of the clone
# box on, so port 22 must answer before this ships.
#
# This installation is Latere's, so it carries Latere's name and Latere's
# mark. Both are settings and neither has a default: an installation nobody
# names calls itself Origo and draws no mark at all.
#
# ORIGOWEB_KEYS_URL turns the SSH keys screen on. It is unset in the base,
# because an operator who runs no key store has no place to add a key and
# is better served by no screen than by one that cannot work.
#
# It and ORIGOWEB_REGISTRY_URL are the platform control plane's public
# address: the repository registry and the key store are platformd's, not
# the identity provider's (spec 029). Both are addresses and neither is a
# credential, so they belong here and not in the Secret. Each client
# appends its own path -- /repositories... and /me/ssh-keys -- so the value
# is the bare base with no suffix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origoweb
spec:
  template:
    spec:
      containers:
        - name: origoweb
          env:
            - name: ORIGOWEB_ORIGO_URL
              value: http://origod.latere.svc.cluster.local
            - name: ORIGOWEB_PUBLIC_URL
              value: https://code.latere.ai
            - name: ORIGOWEB_CLONE_HOST
              value: https://code.latere.ai
            - name: ORIGOWEB_SSH_CLONE_HOST
              value: code.latere.ai
            - name: ORIGOWEB_ISSUER_NAME
              value: Latere
            - name: ORIGOWEB_PRODUCT_NAME
              value: Latere Code
            - name: ORIGOWEB_BRAND_MARK
              value: latere
            # The repository registry: who owns which repository. It is the
            # control plane's now, and the control plane verifies an
            # audience of its own, so every call carries the actor token the
            # issuer mints for api.latere.ai and not the session token.
            # The issuer must grant this client that audience before this
            # setting is applied, or the creation screen fails closed.
            - name: ORIGOWEB_REGISTRY_URL
              value: https://platform.latere.ai
            # The key store. Origo holds no public key: it asks whose an
            # offered key is, and the component that answers is where a
            # person adds one. That is the control plane too, at the same
            # address. The public host rather than an in-cluster Service,
            # because the call carries a token whose audience and issuer are
            # the public ones.
            - name: ORIGOWEB_KEYS_URL
              value: https://platform.latere.ai
            # The OIDC minimum, and nothing more. Key management is the
            # control plane's now (spec 029): it authorizes on the actor
            # token minted for api.latere.ai, not on a scope this client
            # holds at the issuer, so the login scope that once gated the
            # key screen buys nothing. auth's next release drops it from
            # this client's row, and a scope the client does not hold is
            # refused at the authorization request -- that is every
            # sign-in failing, not one screen missing, so this comes out
            # first.
            - name: ORIGOWEB_AUTH_SCOPES
              value: openid,email,profile,offline_access

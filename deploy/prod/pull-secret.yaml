# The image is a private package on ghcr.io, so the kubelet needs a
# credential to pull it. `ghcr-secret` is the one every Latere service in
# this namespace already uses; nothing here creates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origoweb
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret

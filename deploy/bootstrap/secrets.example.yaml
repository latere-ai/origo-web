# The three secrets the interface needs, and nothing else. It holds no
# service credential of its own and mints no token: it can do nothing a
# signed-in person could not do, and only while their token lives.
#
# Copy, fill in, and apply into the namespace. Never commit the filled copy.
apiVersion: v1
kind: Secret
metadata:
  name: origoweb
type: Opaque
stringData:
  # An issuer the installation trusts, in ORIGO_OIDC_ISSUERS.
  auth-url: https://auth.example.com
  # A second OIDC client, registered for the browser flow, whose tokens
  # carry the audience Origo verifies. The client id is a name, not a
  # credential.
  auth-client-id: origoweb
  # Empty means a public client: PKCE (S256) secures the code exchange and
  # nothing here is a secret. Fill it in only for a client the issuer
  # registered as confidential.
  auth-client-secret: ""
  # 32 bytes of hex. Generate with: openssl rand -hex 32
  # Required, and the more so for a public client: there is no client secret
  # to derive a cookie key from, and the relying party refuses to start
  # rather than encrypt every session under a known key.
  # Rotating it signs everyone out, which is the only thing it does.
  cookie-key: ""
